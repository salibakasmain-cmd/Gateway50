name: Build CARAVEL

concurrency:
  group: caravel-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, "arena/**" ]
    paths:
      - "caravel/**"
      - ".github/workflows/build-caravel.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CARAVEL
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch pinned Android PRoot source
        shell: bash
        run: |
          set -euo pipefail
          PR_ROOT="$RUNNER_TEMP/pr"
          PR_COMMIT="fcf25cb2396361f0be2edfc96fdd61a6e738c9d9"
          git clone --filter=blob:none https://github.com/oonid/pr.git "$PR_ROOT"
          git -C "$PR_ROOT" checkout "$PR_COMMIT"

          git -C "$PR_ROOT" -c submodule.vendor/samba.url=https://github.com/samba-team/samba.git submodule update --init --depth 1 vendor/samba

          test "$(git -C "$PR_ROOT" rev-parse HEAD)" = "$PR_COMMIT"
          test -f "$PR_ROOT/vendor/samba/lib/talloc/talloc.c"
          test -s "$PR_ROOT/android/proot-engine/src/main/jniLibs/arm64-v8a/libbusybox.so"
          echo "PR_ROOT=$PR_ROOT" >> "$GITHUB_ENV"
          echo "PR_COMMIT=$PR_COMMIT" >> "$GITHUB_ENV"

      - name: Pin Android NDK r27c
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Build Android PRoot and pr-cli
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s|/home/o/Android/Sdk/ndk/[^/]*/|$ANDROID_NDK_HOME/|g" "$PR_ROOT/src/pr-cli/.cargo/config.toml"
          "$PR_ROOT/scripts/build.sh" --arch=arm64 --ndk-path="$ANDROID_NDK_HOME"

          sed -i '/^pub mod cmd_test;$/d' "$PR_ROOT/src/pr-cli/src/lib.rs"
          sed -i '/^use pr_cli::cmd_test::command_test;$/d' "$PR_ROOT/src/pr-cli/src/main.rs"
          perl -0pi -e 's/\n    Test \{.*?\n    \},\n    #\[command\(name = "clear-cache"\)\]/\n    #[command(name = "clear-cache")]/s' "$PR_ROOT/src/pr-cli/src/main.rs"
          perl -0pi -e 's/\n        Commands::Test \{.*?\n        \}\n        Commands::ClearCache/\n        Commands::ClearCache/s' "$PR_ROOT/src/pr-cli/src/main.rs"
          ! grep -q '^pub mod cmd_test;$' "$PR_ROOT/src/pr-cli/src/lib.rs"
          ! grep -q '^use pr_cli::cmd_test::command_test;$' "$PR_ROOT/src/pr-cli/src/main.rs"
          ! grep -q '^    Test {' "$PR_ROOT/src/pr-cli/src/main.rs"

          (cd "$PR_ROOT/src/pr-cli" && cargo build --target aarch64-linux-android --release --bin pr-cli)

          JNI_DIR="$GITHUB_WORKSPACE/caravel/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$JNI_DIR"
          cp "$PR_ROOT/build/out/arm64/proot" "$JNI_DIR/libproot.so"
          cp "$PR_ROOT/build/out/arm64/loader" "$JNI_DIR/libproot-loader.so"
          cp "$PR_ROOT/src/pr-cli/target/aarch64-linux-android/release/pr-cli" "$JNI_DIR/libpr-cli.so"
          cp "$PR_ROOT/android/proot-engine/src/main/jniLibs/arm64-v8a/libbusybox.so" "$JNI_DIR/libbusybox.so"
          chmod 755 "$JNI_DIR"/*.so

          for lib in libbusybox.so libpr-cli.so libproot.so libproot-loader.so; do
            test -s "$JNI_DIR/$lib"
            file "$JNI_DIR/$lib"
            readelf -h "$JNI_DIR/$lib" | grep -E "Class|Type|Machine|Entry"
            sha256sum "$JNI_DIR/$lib"
          done

      # Keep the native 7-Zip build explicitly triggered from the corrected main branch.
      - name: Build native CARAVEL 7-Zip extractor
        shell: bash
        run: |
          set -euo pipefail

          BIT7Z_ROOT="$RUNNER_TEMP/bit7z"
          SEVENZIP_ROOT="$RUNNER_TEMP/7zip"
          SEVENZIP_OUT="$RUNNER_TEMP/7zip-build"
          JNI_BUILD="$RUNNER_TEMP/caravel-7z-jni"
          JNI_DIR="$GITHUB_WORKSPACE/caravel/app/src/main/jniLibs/arm64-v8a"

          rm -rf "$BIT7Z_ROOT" "$SEVENZIP_ROOT" "$SEVENZIP_OUT" "$JNI_BUILD"

          git clone --depth 1 --branch v4.1.0 https://github.com/rikyoz/bit7z.git "$BIT7Z_ROOT"
          git clone --depth 1 --branch 26.01 https://github.com/ip7z/7zip.git "$SEVENZIP_ROOT"

          export TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC="$TOOLCHAIN/aarch64-linux-android24-clang"
          export CXX="$TOOLCHAIN/aarch64-linux-android24-clang++"
          export AR="$TOOLCHAIN/llvm-ar"
          export RANLIB="$TOOLCHAIN/llvm-ranlib"

          mkdir -p "$SEVENZIP_OUT"

          make -C "$SEVENZIP_ROOT/CPP/7zip/Bundles/Format7zF" \
            -f makefile.gcc \
            -j2 \
            O="$SEVENZIP_OUT" \
            PROG=7z \
            DEF_FILE="$SEVENZIP_ROOT/CPP/7zip/Archive/Archive2.def" \
            CC="$CC" \
            CXX="$CXX" \
            AR="$AR" \
            RANLIB="$RANLIB" \
            LIB2="-ldl" \
            CFLAGS_WARN_WALL="" \
            CFLAGS_WARN="" \
            CXXFLAGS_WARN="" \
            MY_LIBS="-Wl,-z,max-page-size=16384"

          test -s "$SEVENZIP_OUT/7z.so"

          cmake \
            -S "$GITHUB_WORKSPACE/caravel/app/src/main/cpp" \
            -B "$JNI_BUILD" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=24 \
            -DANDROID_STL=c++_shared \
            -DBIT7Z_ROOT="$BIT7Z_ROOT" \
            -DSEVENZIP_ROOT="$SEVENZIP_ROOT"

          cmake --build "$JNI_BUILD" --config Release -j2

          cp "$JNI_BUILD/libcaravel_7z_jni.so" "$JNI_DIR/libcaravel_7z_jni.so"
          cp "$SEVENZIP_OUT/7z.so" "$JNI_DIR/lib7z.so"
          cp "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" "$JNI_DIR/libc++_shared.so"

          chmod 755 "$JNI_DIR"/libcaravel_7z_jni.so "$JNI_DIR"/lib7z.so

          for lib in libcaravel_7z_jni.so lib7z.so libc++_shared.so; do
            test -s "$JNI_DIR/$lib"
            file "$JNI_DIR/$lib"
            readelf -h "$JNI_DIR/$lib" | grep -E "Class|Type|Machine"
            readelf -d "$JNI_DIR/$lib" | grep NEEDED || true
            sha256sum "$JNI_DIR/$lib"
          done

      # Hermes is shipped as a prebuilt Android/ARM64 rootfs overlay.
      # Do not build or install Hermes from source in the CARAVEL build.
      # The runtime downloads the pinned Xermes release layers on-device.

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Build CARAVEL and Bubblie
        working-directory: caravel
        run: gradle :app:assembleDebug :bubblie:assembleDebug --no-daemon --stacktrace

      - name: Verify CARAVEL runtime payload
        id: verify_apk
        working-directory: caravel
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          for lib in libbusybox.so libpr-cli.so libproot.so libproot-loader.so libcaravel_7z_jni.so lib7z.so libc++_shared.so; do
            unzip -l "$APK" | grep -q "lib/arm64-v8a/$lib"
          done
          ! unzip -l "$APK" | grep -q "lib/arm64-v8a/libqroot"
          ! unzip -l "$APK" | grep -q "lib/arm64-v8a/libtermux.so"
          APK_BYTES="$(stat -c '%s' "$APK")"
          APK_SHA256="$(sha256sum "$APK" | cut -d' ' -f1)"
          echo "$APK_BYTES bytes"
          echo "$APK_SHA256  $APK"
          echo "apk_bytes=$APK_BYTES" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"

      - name: Verify Bubblie identity and runtime payload
        id: verify_bubblie_apk
        working-directory: caravel
        shell: bash
        run: |
          set -euo pipefail
          APK="bubblie/build/outputs/apk/debug/bubblie-debug.apk"
          test -s "$APK"
          for lib in libbusybox.so libpr-cli.so libproot.so libproot-loader.so libcaravel_7z_jni.so lib7z.so libc++_shared.so; do
            unzip -l "$APK" | grep -q "lib/arm64-v8a/$lib"
          done
          unzip -p "$APK" classes.dex | strings | grep -q "org/caravel/bubblie/MainActivity"
          ! unzip -p "$APK" classes.dex | strings | grep -q "org/caravel/android/MainActivity"
          APK_BYTES="$(stat -c '%s' "$APK")"
          APK_SHA256="$(sha256sum "$APK" | cut -d' ' -f1)"
          echo "$APK_BYTES bytes"
          echo "$APK_SHA256  $APK"
          echo "apk_bytes=$APK_BYTES" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"

      - name: Upload CARAVEL APK
        uses: actions/upload-artifact@v4
        with:
          name: caravel-debug-${{ steps.verify_apk.outputs.apk_bytes }}-${{ steps.verify_apk.outputs.apk_sha256 }}
          path: caravel/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3

      - name: Upload Bubblie APK
        uses: actions/upload-artifact@v4
        with:
          name: bubblie-debug-${{ steps.verify_bubblie_apk.outputs.apk_bytes }}-${{ steps.verify_bubblie_apk.outputs.apk_sha256 }}
          path: caravel/bubblie/build/outputs/apk/debug/bubblie-debug.apk
          retention-days: 7
